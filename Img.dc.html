<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<img src="{{ src }}" alt="{{ alt }}" loading="{{ loading }}" decoding="async" style="width:100%;height:100%;object-fit:{{ fit }};object-position:{{ pos }};display:block;background:#E7DFD2">
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:520},&quot;src&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;alt&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;loading&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;lazy&quot;,&quot;eager&quot;],&quot;default&quot;:&quot;lazy&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals(){ return { src:this.props.src, alt:this.props.alt||'', loading:this.props.loading||'lazy', fit:this.props.fit||'cover', pos:this.props.pos||'center' }; }
}
</script>
</body>
</html>
