<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Uslovi korišćenja — NÉRA</title>
<meta name="description" content="Uslovi korišćenja NÉRA sajta. NÉRA je fiktivni portfolio projekat.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>html{scroll-behavior:smooth}body{margin:0;background:#F4F0E8;color:#171714;-webkit-font-smoothing:antialiased}a{color:#171714}a:hover{color:#5c564a}@media(max-width:768px){section{padding-top:56px!important;padding-bottom:56px!important}}@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}</style>
</helmet>
<div style="background:#F4F0E8;overflow-x:hidden">
  <dc-import name="Nav" active="" hint-size="100%,88px"></dc-import>

  <section style="padding:clamp(120px,16vh,170px) clamp(20px,5vw,64px) clamp(40px,5vw,64px);max-width:1100px;margin:0 auto">
    <span data-reveal style="font-family:'Manrope',sans-serif;font-size:11px;letter-spacing:0.28em;color:#8b857a;display:block;margin-bottom:30px">NÉRA / PRAVNO</span>
    <h1 data-reveal style="font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(44px,7vw,96px);line-height:0.98;letter-spacing:-0.01em;margin:0">Uslovi korišćenja</h1>
    <p data-reveal style="font-family:'Manrope',sans-serif;font-size:12px;letter-spacing:0.14em;color:#8b857a;margin:28px 0 0">Poslednja izmena: avgust 2026.</p>
  </section>

  <section style="max-width:720px;margin:0 auto;padding:clamp(20px,3vw,40px) clamp(20px,5vw,32px) clamp(90px,13vw,180px)">
    <sc-for list="{{ sections }}" as="s" hint-placeholder-count="7">
      <div data-reveal style="border-top:1px solid rgba(23,23,20,0.14);padding:clamp(32px,4vw,48px) 0">
        <h2 style="font-family:'Manrope',sans-serif;font-weight:500;font-size:12px;letter-spacing:0.2em;color:#8b857a;margin:0 0 8px">{{ s.num }}</h2>
        <h3 style="font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(24px,3vw,36px);line-height:1.1;margin:0 0 18px">{{ s.title }}</h3>
        <sc-for list="{{ s.body }}" as="p" hint-placeholder-count="2">
          <p style="font-family:'Manrope',sans-serif;font-weight:300;font-size:clamp(15px,1.3vw,17px);line-height:1.8;color:#3f3b33;margin:0 0 16px;text-wrap:pretty">{{ p }}</p>
        </sc-for>
      </div>
    </sc-for>
    <p data-reveal style="font-family:'Manrope',sans-serif;font-weight:300;font-size:14px;line-height:1.7;color:#5c564a;margin:clamp(32px,4vw,48px) 0 0;border-top:1px solid rgba(23,23,20,0.14);padding-top:28px">Za pitanja o ovim uslovima piši nam na <a href="mailto:hello@neraskin.rs" style="border-bottom:1px solid rgba(23,23,20,0.3)">hello@neraskin.rs</a>. Vidi i <a href="privatnost.dc.html" style="border-bottom:1px solid rgba(23,23,20,0.3)">Politiku privatnosti</a>.</p>
  </section>

  <dc-import name="Footer" hint-size="100%,560px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount(){
    const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const els=Array.from(document.querySelectorAll('[data-reveal]'));
    els.forEach(el=>{el.style.opacity='0';el.style.transform='translateY(30px)';if(!reduce)el.style.transition='opacity 1s cubic-bezier(.16,1,.3,1), transform 1s cubic-bezier(.16,1,.3,1)';});
    if(reduce){els.forEach(el=>{el.style.opacity='1';el.style.transform='none';});return;}
    const reveal=()=>{const vh=window.innerHeight;els.forEach(el=>{if(el.__r)return;const t=el.getBoundingClientRect().top;if(t<vh*0.9){el.__r=true;el.style.opacity='1';el.style.transform='none';}});};
    window.addEventListener('scroll',reveal,{passive:true});window.addEventListener('resize',reveal);
    reveal();requestAnimationFrame(reveal);setTimeout(reveal,250);
    setTimeout(()=>els.forEach(el=>{el.style.opacity='1';el.style.transform='none';}),2500);
  }
  renderVals(){
    return {sections:[
      {num:'01',title:'O ovom sajtu',body:['NÉRA je fiktivni brend napravljen kao portfolio projekat. Sajt služi za prikaz dizajna i sadržaja, a ne za stvarnu prodaju proizvoda.','Korišćenjem sajta prihvataš uslove opisane na ovoj stranici.']},
      {num:'02',title:'Sadržaj i autorska prava',body:['Tekstovi, fotografije i dizajn na sajtu deo su portfolio prezentacije. Ne koristi ih u komercijalne svrhe bez dogovora.','Nazivi proizvoda i opisi su izmišljeni za potrebe prikaza.']},
      {num:'03',title:'Proizvodi i tvrdnje',body:['Proizvodi prikazani na sajtu ne postoje u prodaji. Opisi sastojaka su informativni i ne predstavljaju medicinski savet.','Za pitanja o nezi kože obrati se dermatologu.']},
      {num:'04',title:'Kontakt forma',body:['Forma na stranici Kontakt je demonstraciona. Poruke se ne šalju niti čuvaju na serveru.']},
      {num:'05',title:'Spoljni linkovi',body:['Sajt može sadržati linkove ka drugim stranicama, poput društvenih mreža. Ne odgovaramo za njihov sadržaj.']},
      {num:'06',title:'Izmene uslova',body:['Uslove možemo povremeno ažurirati. Datum poslednje izmene naveden je na vrhu stranice.']},
    ]};
  }
}
</script>
</body>
</html>
